name: OpenAPI Dependabot

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  update-openapi-specs:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

    steps:
      - name: Checkout api-specs repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.0
        with:
          version: 2201.13.1

      - name: Configure Git
        run: |
          git config --global user.email "ballerina-bot@users.noreply.github.com"
          git config --global user.name "ballerina-bot"

      - name: Run Dependabot Monitor
        run: |
          cd dependabot
          bal clean

          MAX_RETRIES=3
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES..."
            if bal run; then
              echo "Build succeeded!"
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Build failed, retrying in 30 seconds..."
              sleep 30
              rm -rf ~/.ballerina/repositories/central.ballerina.io/cache 2>/dev/null || true
            else
              echo "Build failed after $MAX_RETRIES attempts"
              exit 1
            fi
          done

          cd ..

      # -----------------------------------------------------------------------
      # Always commit repos.json when it changed.
      #
      # The Ballerina monitor updates the `lastChecked` field for every spec it
      # processes (whether or not an actual OpenAPI update was found).  We must
      # persist that change so the frequency gate advances correctly on the next
      # daily run — otherwise every spec would appear "never checked" and be
      # processed every day regardless of its configured frequency.
      #
      # This commit is a direct push to main (no PR needed) because it only
      # touches repos.json metadata, not the OpenAPI specs themselves.
      # -----------------------------------------------------------------------
      - name: Commit lastChecked updates to repos.json
        run: |
          if git diff --quiet repos.json; then
            echo "repos.json unchanged, nothing to commit"
          else
            echo "repos.json has lastChecked updates, committing directly to main"
            git add repos.json
            git commit -m "chore: update lastChecked timestamps in repos.json [skip ci]"
            git push origin main
            echo "repos.json committed successfully"
          fi

      - name: Check for spec updates
        run: |
          if [ -f "UPDATE_SUMMARY.txt" ]; then
            echo "UPDATES_FOUND=true" >> $GITHUB_ENV
            echo "Updates detected!"
          else
            echo "UPDATES_FOUND=false" >> $GITHUB_ENV
            echo "No spec updates found"
          fi

      - name: Create and Push Branch
        if: env.UPDATES_FOUND == 'true'
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="openapi-update-${TIMESTAMP}"
          echo "Creating branch: ${BRANCH_NAME}"
          git checkout -b "${BRANCH_NAME}"

          echo "Git status before add:"
          git status

          git add -A openapi/ UPDATE_SUMMARY.txt

          echo "Git status after add:"
          git status

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: Update OpenAPI specifications"
          git push -u origin "$BRANCH_NAME"
          echo "Branch pushed successfully"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

      - name: Create Pull Request
        if: env.UPDATES_FOUND == 'true'
        run: |
          UPDATE_SUMMARY=$(cat UPDATE_SUMMARY.txt)
          PR_TITLE="[Dependabot] chore: Update OpenAPI Specifications - $(date +%Y-%m-%d)"

          PR_BODY=$(cat <<EOF
          ## OpenAPI Specification Updates

          This PR contains automated updates to OpenAPI specifications detected by the Dependabot monitor.

          ### Changes:
          ${UPDATE_SUMMARY}

          ### Structure:
          All specifications follow the standard structure:
          - openapi/{vendor}/{api}/{version}/openapi.{json|yaml}

          ### Checklist:
          - Review specification changes
          - Verify connector generation works
          - Run tests
          - Update documentation if needed

          ---
          This PR was automatically generated by the OpenAPI Dependabot
          EOF
          )

          PR_URL=$(gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME" \
            --label "openapi-update,automated,dependencies")

          echo "Pull Request created successfully!"
          echo "PR_URL: $PR_URL"

          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "PR_NUMBER=${PR_NUMBER}" >> $GITHUB_ENV

      - name: Wait for Auto-Merge
        if: env.UPDATES_FOUND == 'true' && env.PR_NUMBER != ''
        run: |
          echo "Waiting for auto-review and merge workflow..."
          MAX_WAIT=300
          ELAPSED=0
          INTERVAL=10

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))

            PR_STATE=$(gh pr view "$PR_NUMBER" --json state -q '.state')

            if [ "$PR_STATE" = "MERGED" ]; then
              echo "PR #${PR_NUMBER} has been merged successfully!"
              echo "MERGE_SUCCESSFUL=true" >> $GITHUB_ENV
              break
            elif [ "$PR_STATE" = "CLOSED" ]; then
              echo "PR #${PR_NUMBER} was closed without merging"
              echo "MERGE_SUCCESSFUL=false" >> $GITHUB_ENV
              exit 1
            fi

            echo "Still waiting... (${ELAPSED}s elapsed)"
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "Timeout waiting for PR merge. Triggering connector generation anyway..."
            echo "MERGE_SUCCESSFUL=timeout" >> $GITHUB_ENV
          fi

      - name: Prepare connector update payload
        if: env.UPDATES_FOUND == 'true' && (env.MERGE_SUCCESSFUL == 'true' || env.MERGE_SUCCESSFUL == 'timeout')
        id: prepare_payload
        run: |
          echo "Preparing connector update payload from UPDATE_SUMMARY.txt..."

          if [ ! -f "UPDATE_SUMMARY.txt" ]; then
            echo "UPDATE_SUMMARY.txt not found"
            exit 1
          fi

          # Create JSON array of connector updates
          echo "[]" > connector_updates.json

          while IFS= read -r line || [ -n "$line" ]; do
            if [ -z "$line" ]; then
              continue
            fi

            echo "Processing line: '$line'"

            if [[ "$line" =~ ^([a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+):(.+)$ ]]; then
              SPEC_PATH="${BASH_REMATCH[1]}"
              VERSION_DIR="${BASH_REMATCH[2]}"

              VENDOR=$(echo "$SPEC_PATH" | cut -d'/' -f1)
              API=$(echo "$SPEC_PATH" | cut -d'/' -f2)

              IDENTIFIER="${VENDOR}.${API}"
              CONNECTOR_REPO=$(jq -r ".specMetadata[] | select(.identifier==\"$IDENTIFIER\") | .connectorRepo" repos.json)

              if [ -z "$CONNECTOR_REPO" ] || [ "$CONNECTOR_REPO" = "null" ]; then
                echo "No connector repository configured for $IDENTIFIER"
                continue
              fi

              # Construct spec URL
              SPEC_URL="https://raw.githubusercontent.com/orgAspec/api-specs/main/openapi/${VENDOR}/${API}/${VERSION_DIR}/openapi.json"

              # Verify URL
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SPEC_URL")
              if [ "$HTTP_CODE" != "200" ]; then
                SPEC_URL="https://raw.githubusercontent.com/orgAspec/api-specs/main/openapi/${VENDOR}/${API}/${VERSION_DIR}/openapi.yaml"
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SPEC_URL")
                if [ "$HTTP_CODE" != "200" ]; then
                  echo "ERROR: Neither JSON nor YAML spec found"
                  continue
                fi
              fi

              # Add to JSON array
              CONNECTOR_UPDATE=$(jq -n \
                --arg repo "$CONNECTOR_REPO" \
                --arg spec "$VENDOR/$API" \
                --arg version "$VERSION_DIR" \
                --arg url "$SPEC_URL" \
                '{
                  repository: $repo,
                  specification: $spec,
                  version: $version,
                  openapi_url: $url
                }')

              jq --argjson item "$CONNECTOR_UPDATE" '. += [$item]' connector_updates.json > tmp.json && mv tmp.json connector_updates.json

              echo "Added connector: $CONNECTOR_REPO"
            fi
          done < UPDATE_SUMMARY.txt

          CONNECTOR_COUNT=$(jq 'length' connector_updates.json)
          echo "Prepared $CONNECTOR_COUNT connector updates"
          cat connector_updates.json | jq '.'

          echo "connector_count=$CONNECTOR_COUNT" >> $GITHUB_OUTPUT

      - name: Trigger ballerina-library connector orchestration workflow
        if: env.UPDATES_FOUND == 'true' && steps.prepare_payload.outputs.connector_count > 0
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          echo "Triggering ballerina-library connector orchestration workflow..."

          CONNECTOR_UPDATES=$(cat connector_updates.json | jq -c '.')

          gh api \
            repos/orgBBalLib/ballerina-library/dispatches \
            -X POST \
            -f event_type=orchestrate-connector-updates \
            -f client_payload[sender]=orgAspec/api-specs \
            -f client_payload[connectors]="$CONNECTOR_UPDATES" \
            -f client_payload[trigger_time]="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          echo "Successfully triggered ballerina-library orchestration workflow"
          echo "The ballerina-library workflow will now handle:"
          echo "  1. Triggering all connector regenerations"
          echo "  2. Monitoring connector completion"
          echo "  3. Collecting PR data"
          echo "  4. Sending consolidated email"

      - name: Notify on failure
        if: failure() && env.UPDATES_FOUND == 'true'
        run: |
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body "⚠️ WARNING: OpenAPI Dependabot workflow encountered an error. Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi
